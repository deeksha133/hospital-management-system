{% extends 'base.html' %}{% block heading %}Billing{% endblock %}{% block content %}<section class="two-col"><article class="panel"><h3>Create bill</h3><form method="post" class="form-grid"><label>Patient<select name="patient_id" required><option value="">Select patient</option>{% for p in patients %}<option value="{{p.id}}">{{p.name}}</option>{% endfor %}</select></label><label>Bill date<input type="date" name="bill_date" value="{{today}}" required></label><label class="wide">Description<input name="description" required placeholder="Consultation, tests, medicine..."></label><label>Amount (₹)<input type="number" step="0.01" min="0" name="amount" required></label><label>Status<select name="status"><option>Pending</option><option>Paid</option></select></label><button class="primary wide">Create bill</button></form></article><article class="panel"><h3>Billing history</h3><div class="table-wrap"><table><thead><tr><th>Patient</th><th>Details</th><th>Amount</th><th>Status</th></tr></thead><tbody>{% for r in rows %}<tr><td><b>{{r.patient_name}}</b><small>{{r.bill_date}}</small></td><td>{{r.description}}</td><td><b>₹{{'%.2f'|format(r.amount)}}</b></td><td><form method="post" action="{{url_for('bill_status',item_id=r.id)}}"><select class="status-select" name="status" onchange="this.form.submit()"><option {{'selected' if r.status=='Pending'}}>Pending</option><option {{'selected' if r.status=='Paid'}}>Paid</option></select></form></td></tr>{% else %}<tr><td colspan="4" class="empty">No bills created.</td></tr>{% endfor %}</tbody></table></div></article></section>{% endblock %}
