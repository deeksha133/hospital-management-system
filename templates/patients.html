{% extends 'base.html' %}{% block heading %}Patients{% endblock %}{% block content %}<section class="two-col"><article class="panel"><h3>Register patient</h3><form method="post" class="form-grid"><label>Full name<input name="name" required></label><label>Age<input type="number" min="0" max="120" name="age" required></label><label>Gender<select name="gender"><option>Female</option><option>Male</option><option>Other</option></select></label><label>Phone<input name="phone" required></label><label>Blood group<select name="blood_group"><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select></label><label class="wide">Address<textarea name="address"></textarea></label><button class="primary wide">Register patient</button></form></article><article class="panel"><div class="panel-head"><h3>Patient records</h3><form class="search"><input name="q" value="{{q}}" placeholder="Search name or phone"><button>Search</button></form></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Age</th><th>Phone</th><th>Blood</th><th></th></tr></thead><tbody>{% for r in rows %}<tr><td><b>{{r.name}}</b><small>{{r.gender}}</small></td><td>{{r.age}}</td><td>{{r.phone}}</td><td>{{r.blood_group}}</td><td><form method="post" action="{{url_for('delete_patient',item_id=r.id)}}" onsubmit="return confirm('Delete this patient?')"><button class="danger-link">Delete</button></form></td></tr>{% else %}<tr><td colspan="5" class="empty">No patients found.</td></tr>{% endfor %}</tbody></table></div></article></section>{% endblock %}
