{% extends 'base.html' %}{% block heading %}Doctors{% endblock %}{% block content %}<section class="two-col"><article class="panel"><h3>Add doctor</h3><form method="post" class="form-grid"><label>Doctor name<input name="name" required></label><label>Specialization<input name="specialization" required placeholder="e.g. Cardiology"></label><label>Phone<input name="phone" required></label><label>Email<input type="email" name="email"></label><label class="wide">Availability<input name="availability" placeholder="Mon-Fri, 9 AM-4 PM"></label><button class="primary wide">Add doctor</button></form></article><article class="panel"><h3>Doctor directory</h3><div class="cards">{% for r in rows %}<div class="doctor-card"><div class="avatar">{{r.name[0]}}</div><div><b>Dr. {{r.name}}</b><span>{{r.specialization}}</span><small>{{r.availability or 'Schedule not set'}} · {{r.phone}}</small></div><form method="post" action="{{url_for('delete_doctor',item_id=r.id)}}" onsubmit="return confirm('Delete this doctor?')"><button class="danger-link">×</button></form></div>{% else %}<p class="empty">No doctors added.</p>{% endfor %}</div></article></section>{% endblock %}
